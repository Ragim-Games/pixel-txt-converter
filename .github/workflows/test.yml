name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test Windows app
        shell: powershell
        run: ./windows/build.ps1 -Test
      - name: Verify isolated registry registration
        run: ./dist/WindowsTests.exe --registry
      - uses: actions/upload-artifact@v4
        with:
          name: PixelTxtConverter-Windows
          path: dist/PixelTxtConverter.exe
